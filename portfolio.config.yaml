# ── Projects ───────────────────────────────────────────
# 简历原文「项目经历」
projects:
  - name: "校园失物招领系统"
    description: |
      与团队设计并实现面向校园/园区场景的失物招领系统：前端采用微信小程序完成发布、检索与个人中心管理；后端基于SpringBoot承载核心业务与权限控制；使用FastAPI封装YOLO目标检测/识别服务，实现"图片识别 → 类别/置信度 → 匹配检索"的智能化流程，架构模块化、易扩展、便于维护。

      1. 前后端分离 + 分层架构：小程序端对接SpringBootRESTAPI；后端按Controller/Service/DAO分层，统一响应结构、全局异常处理与日志，提升可维护性与排障效率。
      2. 数据建模与业务闭环：设计失物/招领/匹配/用户等领域模型与表结构，打通发布 → 编辑 → 状态流转（待认领/处理中/已归还）全流程；支持分页、排序与组合条件查询。
      3. 多维度校验与接口安全：前端表单校验（必填/格式/长度），后端二次校验（参数/业务规则），有效拦截非法输入；实现登录态与接口鉴权（如JWT/Session），保护用户数据与操作权限。
      4. 交互体验优化：提交/查询过程提供实时反馈与循环校验，完善加载态/空态/错误提示；支持"我的发布/我的认领"管理，提升使用流畅度。
      5. 联调与文档化：使用OpenAPI维护接口文档，规范字段与错误码，保证前后端协作与迭代效率。
